name: Deploy docs

on:
  workflow_dispatch:
    inputs:
      site_ref:
        description: 'Ref to build the site from (default: the latest non-prerelease tag)'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags, and enough history to make worktrees from them

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Every tag becomes a selectable version; see the script for how and why.
      - name: Build every version and the site
        env:
          SITE_REF: ${{ inputs.site_ref }}
          DOCS_BASE: lickle-docs
        run: node --experimental-strip-types .github/scripts/deploy-docs.ts

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
